org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Which loader subprojects to build. Only fabric is wired up for 1.21.11 here.
available_loaders=fabric

minecraft_version=1.21.11
java_version=21

mod_version=1.0.0
maven_group=baritone
archives_base_name=baritone

# Fabric loader version (consumed by unimined `fabric { loader ... }`)
fabric_version=0.16.5

# Compile-only deps for the common source set
mixin_version=0.8.5
asm_version=9.7

# Native pathfinder used by the elytra process
nether_pathfinder_version=1.4.1
